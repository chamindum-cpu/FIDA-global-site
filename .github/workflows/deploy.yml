name: Deploy Next.js to Linux Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fida-web:latest

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/var/www/fida-web"

      - name: Deploy to Linux Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # NOTE: Please change 'cd /var/www/fida-web' to the actual path on your Linux server 
            # where the docker-compose.yml file is located.
            cd /var/www/fida-web
            
            # Pull the latest image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/fida-web:latest
            
            # Stop the old container
            docker-compose down
            
            # Create a .env file on the server if needed, or pass variables through docker-compose
            # Update the image in docker-compose.yml if you're pulling from a registry
            # Make sure docker-compose.yml on the server has image: ${{ secrets.DOCKER_USERNAME }}/fida-web:latest
            
            # Start the new container
            docker-compose up -d
            
            # Clean up old unused images to free up disk space
            docker image prune -f
